version: "3.9"
services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
  wp:
    image: wordpress:php8.2-apache
    ports: ["8080:80"]
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      WP_DEBUG: "true"
      WP_DEBUG_LOG: "true"
    volumes:
      # WordPress 本体
      - wpdata:/var/www/html
      # ★ プラグインを直接マウント（あなたのリポのフォルダに合わせて）
      - ./wordpress-plugin/event-venue-manager:/var/www/html/wp-content/plugins/event-venue-manager
volumes:
  dbdata:
  wpdata:
